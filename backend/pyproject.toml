[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["."]
