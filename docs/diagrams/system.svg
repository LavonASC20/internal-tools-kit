<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
  <title id="t">Internal tools kit: the path of one request</title>
  <desc id="d">The path of one request. The web app sends it. In the backend core, auth identifies the caller and policy checks that their role holds the action. The tool runs its own logic. Core approvals makes sure a second person decides, and core audit records the change in the same transaction. Postgres commits it, where a check blocks self-approval and the audit table is append-only. On the way back, core masking hides PII the caller may not read. Devin adds the next tool from a playbook. CI runs seven guardrail tests on every pull request.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6770"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b07a10"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1c2329; font-size: 14px; }
      .b { font-weight: 700; }
      .s { font-size: 12.5px; fill: #3b4650; }
      .zl { font-size: 12px; fill: #5b6770; font-weight: 700; letter-spacing: .6px; }
      .zone { fill: #fbfcfd; stroke: #b8c0c7; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .edge { fill: #f4f6f8; stroke: #5b6770; stroke-width: 1.5; }
      .ghost { fill: #ffffff; stroke: #b07a10; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .enf { fill: #e8f1fb; stroke: #2f6db5; stroke-width: 2; }
      .store { fill: #fff6e0; stroke: #b07a10; stroke-width: 2; }
      .inner { fill: #ffffff; stroke: #b07a10; stroke-width: 1.5; }
      .gate { fill: #fdeceb; stroke: #b5392f; stroke-width: 2; }
      .ar { fill: none; stroke: #5b6770; stroke-width: 2; marker-end: url(#ah); }
      .dv { fill: none; stroke: #b07a10; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#ad); }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text class="b" x="24" y="32" style="font-size:17px">Controls are centralized in the core, and every tool inherits them.</text>
  <text class="s" x="24" y="54" style="font-size:14px">No tool re-implements or reconfigures auth. Each tool only declares its own roles, approvals and PII fields.</text>

  <!-- web -->
  <rect class="edge" x="24" y="300" width="160" height="180" rx="8"/>
  <text class="b" x="104" y="384" text-anchor="middle">Web app</text>
  <text class="s" x="104" y="406" text-anchor="middle">shell and tool pages</text>

  <!-- backend -->
  <rect class="zone" x="220" y="74" width="780" height="456" rx="10"/>
  <text class="zl" x="236" y="96">BACKEND (FASTAPI)</text>

  <!-- tools -->
  <rect class="zone" x="236" y="108" width="748" height="110" rx="8"/>
  <text class="zl" x="252" y="130">3 · TOOLS</text>
  <rect class="edge" x="252" y="140" width="220" height="62" rx="8"/>
  <text class="b" x="362" y="166" text-anchor="middle">kyc_review</text>
  <text class="s" x="362" y="187" text-anchor="middle">propose a KYC decision</text>
  <rect class="edge" x="488" y="140" width="220" height="62" rx="8"/>
  <text class="b" x="598" y="166" text-anchor="middle">feature_flags</text>
  <text class="s" x="598" y="187" text-anchor="middle">toggle flags, dev to prod</text>
  <rect class="ghost" x="724" y="140" width="220" height="62" rx="8"/>
  <text class="b" x="834" y="166" text-anchor="middle" style="fill:#7a5408">next tool</text>
  <text class="s" x="834" y="187" text-anchor="middle">refunds, and ten more</text>

  <!-- core -->
  <rect class="zone" x="236" y="264" width="748" height="250" rx="8"/>
  <text class="zl" x="252" y="286">CORE</text>

  <rect class="enf" x="252" y="300" width="164" height="70" rx="8"/>
  <text class="b" x="334" y="330" text-anchor="middle">1 · auth</text>
  <text class="s" x="334" y="351" text-anchor="middle">identifies the caller</text>

  <rect class="enf" x="436" y="300" width="164" height="70" rx="8"/>
  <text class="b" x="518" y="330" text-anchor="middle">2 · policy</text>
  <text class="s" x="518" y="351" text-anchor="middle">role must hold the action</text>

  <rect class="enf" x="620" y="300" width="164" height="70" rx="8"/>
  <text class="b" x="702" y="330" text-anchor="middle">4 · approvals</text>
  <text class="s" x="702" y="351" text-anchor="middle">a second person decides</text>

  <rect class="enf" x="804" y="300" width="164" height="70" rx="8"/>
  <text class="b" x="886" y="330" text-anchor="middle">5 · audit</text>
  <text class="s" x="886" y="351" text-anchor="middle">one row, same transaction</text>

  <rect class="enf" x="804" y="412" width="164" height="70" rx="8"/>
  <text class="b" x="886" y="442" text-anchor="middle">7 · masking</text>
  <text class="s" x="886" y="463" text-anchor="middle">hides PII unless allowed</text>

  <!-- devin -->
  <rect class="store" x="1040" y="140" width="216" height="62" rx="8"/>
  <text class="b" x="1148" y="166" text-anchor="middle">Devin + playbook</text>
  <text class="s" x="1148" y="187" text-anchor="middle">builds the next tool</text>
  <path class="dv" d="M1040 171 H944"/>

  <!-- postgres -->
  <rect class="store" x="1040" y="280" width="216" height="222" rx="10"/>
  <text class="b" x="1148" y="306" text-anchor="middle">6 · Postgres</text>
  <rect class="inner" x="1054" y="320" width="188" height="76" rx="6"/>
  <text class="b" x="1148" y="350" text-anchor="middle" style="font-size:13px">approval_requests</text>
  <text class="s" x="1148" y="372" text-anchor="middle">a CHECK blocks self-approval</text>
  <rect class="inner" x="1054" y="410" width="188" height="76" rx="6"/>
  <text class="b" x="1148" y="440" text-anchor="middle" style="font-size:13px">audit_events</text>
  <text class="s" x="1148" y="462" text-anchor="middle">append-only, by a trigger</text>

  <!-- request path -->
  <path class="ar" d="M184 335 H252"/>
  <path class="ar" d="M416 335 H436"/>
  <path class="ar" d="M518 300 V218"/>
  <path class="ar" d="M702 218 V300"/>
  <path class="ar" d="M784 335 H804"/>
  <path class="ar" d="M968 335 H1040"/>
  <!-- response path -->
  <path class="ar" d="M1040 447 H968"/>
  <path class="ar" d="M804 447 H184"/>

  <!-- CI -->
  <rect class="gate" x="236" y="576" width="748" height="68" rx="8"/>
  <text class="b" x="610" y="604" text-anchor="middle" style="fill:#b5392f">CI</text>
  <text class="s" x="610" y="626" text-anchor="middle">seven guardrail tests on every pull request</text>
  <path class="ar" d="M610 576 V530"/>
</svg>
