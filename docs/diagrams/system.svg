<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
  <title id="t">Internal tools kit architecture</title>
  <desc id="d">A web app calls a FastAPI backend. In the backend, tools sit on a shared core of auth, policy, approvals, audit and masking. The backend stores data in Postgres, where a check blocks self-approval and the audit table is append-only. Devin adds the next tool from a playbook. CI runs seven guardrail tests on every pull request.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6770"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b07a10"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1c2329; font-size: 14px; }
      .b { font-weight: 700; }
      .s { font-size: 13px; fill: #3b4650; }
      .zl { font-size: 12px; fill: #5b6770; font-weight: 700; letter-spacing: .6px; }
      .zone { fill: #fbfcfd; stroke: #b8c0c7; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .edge { fill: #f4f6f8; stroke: #5b6770; stroke-width: 1.5; }
      .ghost { fill: #ffffff; stroke: #b07a10; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .enf { fill: #e8f1fb; stroke: #2f6db5; stroke-width: 2; }
      .store { fill: #fff6e0; stroke: #b07a10; stroke-width: 2; }
      .inner { fill: #ffffff; stroke: #b07a10; stroke-width: 1.5; }
      .gate { fill: #fdeceb; stroke: #b5392f; stroke-width: 2; }
      .ar { fill: none; stroke: #5b6770; stroke-width: 2; marker-end: url(#ah); }
      .dv { fill: none; stroke: #b07a10; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#ad); }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text class="b" x="24" y="40" style="font-size:17px">Controls are written once in the core. Every tool inherits them, and CI proves it.</text>

  <!-- web -->
  <rect class="edge" x="24" y="330" width="220" height="80" rx="8"/>
  <text class="b" x="134" y="364" text-anchor="middle">Web app</text>
  <text class="s" x="134" y="386" text-anchor="middle">React shell and tool pages</text>

  <!-- backend -->
  <rect class="zone" x="290" y="70" width="600" height="500" rx="10"/>
  <text class="zl" x="306" y="92">BACKEND (FASTAPI)</text>

  <rect class="zone" x="310" y="106" width="560" height="124" rx="8"/>
  <text class="zl" x="326" y="128">TOOLS</text>
  <rect class="edge" x="325" y="140" width="170" height="72" rx="8"/>
  <text class="b" x="410" y="170" text-anchor="middle">kyc_review</text>
  <text class="s" x="410" y="192" text-anchor="middle">propose a KYC decision</text>
  <rect class="edge" x="505" y="140" width="170" height="72" rx="8"/>
  <text class="b" x="590" y="170" text-anchor="middle">feature_flags</text>
  <text class="s" x="590" y="192" text-anchor="middle">toggle flags, dev to prod</text>
  <rect class="ghost" x="685" y="140" width="170" height="72" rx="8"/>
  <text class="b" x="770" y="170" text-anchor="middle" style="fill:#7a5408">next tool</text>
  <text class="s" x="770" y="192" text-anchor="middle">refunds, and ten more</text>

  <path class="ar" d="M590 230 V290"/>

  <rect class="zone" x="310" y="290" width="560" height="262" rx="8"/>
  <text class="zl" x="326" y="312">CORE</text>
  <rect class="enf" x="326" y="324" width="528" height="36" rx="6"/>
  <text class="b" x="344" y="347">auth</text>
  <text class="s" x="450" y="347">identifies the caller</text>
  <rect class="enf" x="326" y="368" width="528" height="36" rx="6"/>
  <text class="b" x="344" y="391">policy</text>
  <text class="s" x="450" y="391">one action per route, deny by default</text>
  <rect class="enf" x="326" y="412" width="528" height="36" rx="6"/>
  <text class="b" x="344" y="435">approvals</text>
  <text class="s" x="450" y="435">a second person decides, never the proposer</text>
  <rect class="enf" x="326" y="456" width="528" height="36" rx="6"/>
  <text class="b" x="344" y="479">audit</text>
  <text class="s" x="450" y="479">one row per state change, in the same transaction</text>
  <rect class="enf" x="326" y="500" width="528" height="36" rx="6"/>
  <text class="b" x="344" y="523">masking</text>
  <text class="s" x="450" y="523">hides PII unless the caller may read it</text>

  <!-- devin -->
  <rect class="store" x="940" y="140" width="316" height="72" rx="8"/>
  <text class="b" x="1098" y="170" text-anchor="middle">Devin + playbook</text>
  <text class="s" x="1098" y="192" text-anchor="middle">adds the next tool from one request</text>
  <path class="dv" d="M940 176 H855"/>

  <!-- postgres -->
  <rect class="store" x="940" y="262" width="316" height="216" rx="10"/>
  <text class="b" x="1098" y="290" text-anchor="middle">Postgres</text>
  <rect class="inner" x="958" y="306" width="280" height="68" rx="6"/>
  <text class="b" x="1098" y="334" text-anchor="middle">approval_requests</text>
  <text class="s" x="1098" y="356" text-anchor="middle">a CHECK blocks self-approval</text>
  <rect class="inner" x="958" y="390" width="280" height="68" rx="6"/>
  <text class="b" x="1098" y="418" text-anchor="middle">audit_events</text>
  <text class="s" x="1098" y="440" text-anchor="middle">append-only, enforced by a trigger</text>

  <path class="ar" d="M244 370 H290"/>
  <path class="ar" d="M890 370 H940"/>

  <!-- CI -->
  <rect class="gate" x="290" y="606" width="600" height="72" rx="8"/>
  <text class="b" x="590" y="636" text-anchor="middle" style="fill:#b5392f">CI</text>
  <text class="s" x="590" y="658" text-anchor="middle">seven guardrail tests, discovered at runtime, on every pull request</text>
  <path class="ar" d="M590 606 V570"/>
</svg>
